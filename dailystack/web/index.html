<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="DailyStack — 1 micro-cours Backend ou DevOps chaque jour.">
  <meta name="theme-color" content="#0F172A">

  <!-- Mode plein écran PWA (Android Chrome & iOS Safari "Sur l'écran d'accueil") -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DailyStack">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DailyStack</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #080D1A;
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
    }
    #pwa-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, rgba(34, 211, 238, 0.16) 0%, #080D1A 65%);
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: 9999;
      transition: opacity 0.25s ease-out;
    }
    #pwa-splash img {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      box-shadow: 0 12px 32px rgba(34, 211, 238, 0.22);
      margin-bottom: 24px;
    }
    #pwa-splash .title {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }
    #pwa-splash .subtitle {
      margin-top: 6px;
      font-size: 13px;
      color: #94A3B8;
    }
    #pwa-splash .spinner {
      margin-top: 32px;
      width: 26px;
      height: 26px;
      border: 3px solid rgba(34, 211, 238, 0.18);
      border-top-color: #22D3EE;
      border-radius: 50%;
      animation: ds-spin 0.8s linear infinite;
    }
    @keyframes ds-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="pwa-splash">
    <img src="icons/Icon-192.png" alt="DailyStack">
    <div class="title">DailyStack</div>
    <div class="subtitle">Backend · DevOps · Veille Tech</div>
    <div class="spinner"></div>
  </div>

  <script>
    window.__dsDeferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__dsDeferredPrompt = e;
    });
    window.__dsHasInstallPrompt = function () {
      return window.__dsDeferredPrompt !== null;
    };
    window.__dsTriggerInstallPrompt = async function () {
      var promptEvent = window.__dsDeferredPrompt;
      if (!promptEvent) return false;
      promptEvent.prompt();
      var choice = await promptEvent.userChoice;
      window.__dsDeferredPrompt = null;
      return choice && choice.outcome === 'accepted';
    };
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('pwa-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function () { splash.remove(); }, 260);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
